<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon</title>
    <style>
        body{
            background-color: white;
        }
        .box{
            margin: 2px;
            width: 100px;
            height:100px;
            border:3px solid black;
            border-radius: 6px;
        }

        .boxes{
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap:10px;
        }

        .box1{
            background-color: red;
        }

        .box2{
            background-color: blue;;
        }

        .box3{
            background-color: green;
        }

        .box4{
            background-color: yellow;
        }

        .flash{
            background-color: white;
        }
        .userflash{
            background-color: pink;
        }

        
    </style>
</head>
<body>
    <div class="container" style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <h1 style="color: black;">Simon Game</h1>
        <div class="score" style="text-align: center;">
            <h3 style="color:black">Press any key to start</h3>

        </div>

        <div class="boxes">
            <div class="box1 box" id="box1"></div>
            <div class="box2 box" id="box2"></div>
            <div class="box3 box" id="box3"></div>
            <div class="box4 box" id="box4"></div>
        </div>
    </div>
    <script src="str.js"></script>
</body>
</html>
