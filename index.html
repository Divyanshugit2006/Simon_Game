<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <h1 style="color: black;">Simon Game</h1>
        <div class="score" style="text-align: center;">
            <h3 style="color:black">Press any key to start</h3>

        </div>

        <div class="boxes">
            <div class="box1 box" id="box1"></div>
            <div class="box2 box" id="box2"></div>
            <div class="box3 box" id="box3"></div>
            <div class="box4 box" id="box4"></div>
        </div>
    </div>
    <script src="str.js"></script>
</body>
</html>
